name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      # The vendored shared stylesheet must match the hash pinned when it was last re-vendored.
      - run: STANDALONE_UI_CANONICAL_URL=https://raw.githubusercontent.com/curtismu7/AI-DEMO-Standalone/main/shared/standalone-ui.css bash scripts/check-ui-standard.sh
      - run: npm run build
  forbidden-strings:
    # Fails if a tracked file holds a string from the forbidden-strings list (one per line), an unlisted UUID in docs,
    # or an unlisted private hostname. The list comes from the FORBIDDEN_STRINGS repo secret (docs/forbidden-strings.md).
    # With no secret the script exits 1 under CI=true, so this cannot be skipped. Only counts are printed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - env:
          FORBIDDEN_STRINGS: ${{ secrets.FORBIDDEN_STRINGS }}
        run: |
          if [ -n "$FORBIDDEN_STRINGS" ]; then
            printf '%s\n' "$FORBIDDEN_STRINGS" > "$RUNNER_TEMP/forbidden-strings.txt"
            export FORBIDDEN_STRINGS_FILE="$RUNNER_TEMP/forbidden-strings.txt"
          fi
          npm run check:forbidden
      - name: No AI attribution (owner rule 2026-11-07)
        run: bash scripts/check-no-ai-attribution.sh
  gitleaks:
    # Fails the PR if any commit in its history contains a secret.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks version
      - name: Scan history
        run: ./gitleaks detect --source . --redact --no-banner -v


  postman:
    # The Postman collection against the lab's own server: boots on a spare
    # port, runs newman with the committed placeholder environment, fails on
    # any assertion. Regenerate with shared/postman/generator.mjs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check out the family shared directory
        uses: actions/checkout@v5
        with:
          repository: curtismu7/AI-DEMO-Standalone
          ref: main
          path: family
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: npm ci
      - run: npm run build --if-present
      - name: Run the collection
        env:
          ALLOW_MOCK_SIGNIN: '1'
        run: bash family/shared/postman/ci-check.sh id-jag-standalone-lab /api/health npm start
